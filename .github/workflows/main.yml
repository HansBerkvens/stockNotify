name: Stock Price Check

on:
  schedule:
    - cron: '0 8,13,20 * * *'   # UTC times — 3x/day
  workflow_dispatch:             # lets you trigger it manually from the Actions tab too

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          STOCK_NOTIFY_EMAIL_PASSWORD: ${{ secrets.STOCK_NOTIFY_EMAIL_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: python main.py
